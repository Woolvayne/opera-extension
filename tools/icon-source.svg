<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d33"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#3b9dff"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="124" y="152" width="264" height="164" rx="18"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#2ee6a8" stroke-opacity="0.5" stroke-width="8"/>

  <!-- monitor body -->
  <rect x="104" y="132" width="304" height="204" rx="30" fill="none" stroke="#ffffff" stroke-width="26"/>
  <rect x="228" y="330" width="56" height="48" fill="#ffffff"/>
  <rect x="156" y="376" width="200" height="30" rx="15" fill="#ffffff"/>

  <!-- signal inside screen -->
  <g clip-path="url(#screenClip)">
    <circle cx="256" cy="286" r="26" fill="url(#sig)"/>
    <path d="M196 286 a60 60 0 0 1 120 0" fill="none" stroke="url(#sig)" stroke-width="22" stroke-linecap="round"/>
    <path d="M156 286 a100 100 0 0 1 200 0" fill="none" stroke="url(#sig)" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
